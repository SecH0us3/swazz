apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swazz.fullname" . }}-runner
  labels:
    {{- include "swazz.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: {{ .Values.runner.replicaCount }}
  selector:
    matchLabels:
      {{- include "swazz.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runner
  template:
    metadata:
      labels:
        {{- include "swazz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runner
    spec:
      containers:
        - name: runner
          image: {{ include "swazz.image" (dict "repository" .Values.runner.image.repository "tag" .Values.runner.image.tag "message" "runner.image.tag is required: set an immutable tag, or a sha256:... digest") | quote }}
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          # run-agent takes its configuration from flags, not the environment,
          # so the values below are passed explicitly as arguments.
          args:
            - "run-agent"
            - "--coordinator"
            - {{ index .Values.runner.env "COORDINATOR_URL" | default (printf "ws://%s-edge:%v/api/runners/connect" (include "swazz.fullname" .) .Values.edge.service.port) | quote }}
            - "--token"
            - {{ index .Values.runner.env "RUNNER_TOKEN" | default "" | quote }}
            {{- if .Values.runner.name }}
            - "--name"
            - {{ .Values.runner.name | quote }}
            {{- end }}
          env:
            - name: COORDINATOR_URL
              value: {{ index .Values.runner.env "COORDINATOR_URL" | default (printf "ws://%s-edge:%v/api/runners/connect" (include "swazz.fullname" .) .Values.edge.service.port) | quote }}
            {{- range $key, $value := .Values.runner.env }}
            {{- if ne $key "COORDINATOR_URL" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
      {{- with .Values.runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
