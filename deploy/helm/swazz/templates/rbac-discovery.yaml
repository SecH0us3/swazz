{{- if .Values.discovery.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "swazz.fullname" . }}-discovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "swazz.labels" . | nindent 4 }}
    app.kubernetes.io/component: discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "swazz.fullname" . }}-discovery
  labels:
    {{- include "swazz.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "swazz.fullname" . }}-discovery
  labels:
    {{- include "swazz.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "swazz.fullname" . }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "swazz.fullname" . }}-discovery
    namespace: {{ .Release.Namespace }}
{{- end }}
