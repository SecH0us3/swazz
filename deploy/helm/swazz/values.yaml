# Default values for swazz helm chart.

global:
  domain: swazz.local
  # jwtSecret must be provided during installation, e.g., --set global.jwtSecret=mysecret
  jwtSecret: ""

web:
  replicaCount: 1
  image:
    # No web image is published from this repository; build and push one from
    # packages/web/Dockerfile, then set repository and tag below.
    repository: sech0us3/swazz-web
    pullPolicy: IfNotPresent
    # Required. Use an immutable tag or a sha256 digest — never a mutable tag
    # such as "latest" (see the supply-chain rules in CLAUDE.md).
    tag: ""
  service:
    type: ClusterIP
    port: 80
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

edge:
  replicaCount: 1
  image:
    # No edge image is published from this repository; build and push one from
    # packages/edge/Dockerfile, then set repository and tag below.
    repository: sech0us3/swazz-edge
    pullPolicy: IfNotPresent
    # Required. Immutable tag or sha256 digest only.
    tag: ""
  service:
    type: ClusterIP
    port: 80
  env:
    AUTH_ENABLED: "true"
    LIMIT_ANONYMOUS: "true"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

runner:
  replicaCount: 1
  image:
    repository: ghcr.io/sech0us3/swazz
    pullPolicy: IfNotPresent
    # Required. Immutable tag or sha256 digest only — release tags and
    # sha-<short-commit> tags are published by .github/workflows/release.yml.
    tag: ""
  env:
    # RUNNER_TOKEN decides whose scans this runner takes:
    # - a user or Service Account API key from the dashboard: only that account's scans;
    # - the coordinator's SHARED_RUNNER_TOKEN (set SWAZZ_RUNNER_TOKEN in edge.env to the same
    #   value, at least 32 chars): every user's scans, target credentials included.
    # Required: there is no usable default.
    RUNNER_TOKEN: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    # Adjust annotations as needed for your ingress controller
  hosts:
    - host: swazz.local
      paths:
        - path: /api/?(.*)
          pathType: ImplementationSpecific
          backend: edge
        - path: /(.*)
          pathType: ImplementationSpecific
          backend: web
  tls: []

discovery:
  enabled: false
  schedule: "0 2 * * *" # Every day at 02:00 UTC
  image:
    repository: ghcr.io/sech0us3/swazz
    pullPolicy: IfNotPresent
    # Required. Immutable tag or sha256 digest only — release tags and
    # sha-<short-commit> tags are published by .github/workflows/release.yml.
    tag: ""
  concurrency: 5
  iterations: 10
  profiles: "BOUNDARY,MALICIOUS"
  excludeNamespaces: "kube-system,kube-public,kube-node-lease"
  reports:
    sarif: true
    html: true
    json: false
    uploadTo: "local"       # "local", "coordinator"
    uploadPath: "/tmp/swazz-discovery/reports"
    coordinatorURL: ""
    coordinatorToken: ""
  webhookURL: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

