version: 2
updates:
  # 1. npm Workspaces (root + all workspaces: web, edge, rag, shared, extension, demo, docs)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # packages/edge must stay on vitest 4 until @cloudflare/vitest-pool-workers supports
      # vitest 5 (0.22.0 peers vitest ^4.1.0). Remove this once it does, and upgrade edge.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  # 2. Go Modules (Backend Fuzzing Engine)
  - package-ecosystem: "gomod"
    directory: "/packages/container"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"

  # 3. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
