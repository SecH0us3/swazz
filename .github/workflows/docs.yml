name: Deploy Documentation

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
  # ci.yml ignores docs/**, so docs-only PRs are checked here: the dashboard's
  # docs links (packages/web/src/utils/docsLinks.ts) must still resolve.
  pull_request:
    branches: [ master ]
    paths:
      - 'docs/**'
      - 'packages/web/src/utils/docsLinks*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        # v6.4.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '25.9.0'
          cache: 'npm'

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        # v6.0.0
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Check dashboard docs links
        run: npm run test --workspace=packages/web -- src/utils/docsLinks.test.ts

      - name: Build documentation
        run: npm run build --workspace=docs

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        # v3.0.1
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # v5.0.0
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
