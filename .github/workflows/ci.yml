name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'GEMINI.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'GEMINI.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # paths-filter lists a pull request's changed files through the REST API,
      # which a private repository answers only with this permission.
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      edge: ${{ steps.filter.outputs.edge }}
      e2e: ${{ steps.filter.outputs.e2e }}
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v4.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            frontend:
              - 'packages/web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            backend:
              - 'packages/container/**'
              # The Go demo targets are built by this job and by nothing else.
              - 'demo/ws/**'
              - 'demo/grpc/**'
              - '.github/workflows/ci.yml'
            edge:
              - 'packages/edge/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            extension:
              - 'packages/extension/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            e2e:
              - 'packages/web/**'
              - 'packages/edge/**'
              - 'packages/container/**'
              - 'packages/extension/**'
              - 'demo/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - '.github/workflows/ci.yml'

  test-extension:
    name: Test Extension
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.9.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test --workspace=packages/extension -- --coverage

  test-frontend:
    name: Test Frontend
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.9.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm test --workspace=packages/web -- --coverage

      - name: Update Frontend Coverage Badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        run: |
          cd packages/web
          COVERAGE=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('coverage/coverage-summary.json')); console.log(data.total.statements.pct)")
          echo "Frontend coverage: $COVERAGE"
          
          COLOR="red"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then COLOR="success";
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then COLOR="yellow";
          fi
          
          curl -s "https://img.shields.io/badge/frontend--coverage-${COVERAGE}%25-${COLOR}" -o frontend-coverage.svg
          
          cp frontend-coverage.svg /tmp/frontend-coverage.svg
          cd ../..
          git reset --hard HEAD
          git clean -fd
          git fetch origin badges:badges 2>/dev/null || git fetch origin badges
          git checkout -f badges
          cp /tmp/frontend-coverage.svg frontend-coverage.svg
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend-coverage.svg
          git commit -m "chore: update frontend coverage badge [skip ci]" || echo "No changes"
          for i in {1..5}; do
            git pull --rebase origin badges || true
            if git push origin badges; then
              break
            fi
            sleep $((RANDOM % 3 + 1))
          done

  test-edge:
    name: Test Edge
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.9.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts

      # Vitest transpiles without type checking, so nothing else in CI type checks
      # this package. It went unchecked entirely until the `types` entry in
      # tsconfig.json was repaired: an unresolvable entry makes tsc abort after one
      # error, which reads as a near-clean run while checking nothing.
      - name: Typecheck
        run: npx tsc --noEmit -p packages/edge

      - name: Run tests
        run: npm test --workspace=packages/edge -- --coverage

      - name: Update Edge Coverage Badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        run: |
          cd packages/edge
          COVERAGE=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('coverage/coverage-summary.json')); console.log(data.total.statements.pct)")
          echo "Edge coverage: $COVERAGE"
          
          COLOR="red"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then COLOR="success";
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then COLOR="yellow";
          fi
          
          curl -s "https://img.shields.io/badge/edge--coverage-${COVERAGE}%25-${COLOR}" -o edge-coverage.svg
          
          cp edge-coverage.svg /tmp/edge-coverage.svg
          cd ../..
          git reset --hard HEAD
          git clean -fd
          git fetch origin badges:badges 2>/dev/null || git fetch origin badges
          git checkout -f badges
          cp /tmp/edge-coverage.svg edge-coverage.svg
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add edge-coverage.svg
          git commit -m "chore: update edge coverage badge [skip ci]" || echo "No changes"
          for i in {1..5}; do
            git pull --rebase origin badges || true
            if git push origin badges; then
              break
            fi
            sleep $((RANDOM % 3 + 1))
          done

  test-backend:
    name: Test Backend
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # v6.4.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache-dependency-path: packages/container/go.sum

      # The demo targets live outside packages/container, so nothing compiled them.
      # demo/ws/main.go had not built since the commit that introduced it.
      - name: Build demo targets
        run: |
          (cd demo/ws && go build -o /dev/null .)
          (cd demo/grpc && go build -o /dev/null .)

      - name: Run tests
        run: cd packages/container && go test -coverprofile=coverage.out ./...

      - name: Update Backend Coverage Badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        run: |
          cd packages/container
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Backend coverage: $COVERAGE"
          
          COLOR="red"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then COLOR="success";
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then COLOR="yellow";
          fi
          
          curl -s "https://img.shields.io/badge/backend--coverage-${COVERAGE}%25-${COLOR}" -o backend-coverage.svg
          
          cp backend-coverage.svg /tmp/backend-coverage.svg
          cd ../..
          git reset --hard HEAD
          git clean -fd
          git fetch origin badges:badges 2>/dev/null || git fetch origin badges
          git checkout -f badges
          cp /tmp/backend-coverage.svg backend-coverage.svg
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend-coverage.svg
          git commit -m "chore: update backend coverage badge [skip ci]" || echo "No changes"
          for i in {1..5}; do
            git pull --rebase origin badges || true
            if git push origin badges; then
              break
            fi
            sleep $((RANDOM % 3 + 1))
          done

  test-e2e:
    name: Test E2E (Playwright) - Shard ${{ matrix.shardIndex }} of ${{ matrix.shardTotal }}
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        # v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.9.0'
          cache: 'npm'

      - name: Set up Go
        # v6.4.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache-dependency-path: packages/container/go.sum

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply first-party patches (wrangler dev stability fix)
        # --ignore-scripts above skips postinstall for every dependency (defense against
        # supply-chain attacks via third-party postinstall scripts). This job is the only
        # one that runs `wrangler dev` (via tests/e2e/run-e2e.sh), so it is the only one
        # that needs our own patches/wrangler+4.125.0.patch applied. Invoking patch-package
        # directly here applies only that patch, not any other package's postinstall.
        run: npx patch-package

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          TARGET_SPECS=$(bash scripts/get-affected-e2e.sh)
          SHARD_ARG="--shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
          if [ "$TARGET_SPECS" = "NONE" ]; then
            echo "✓ No frontend or edge routes affected by this change. Skipping browser E2E tests."
            exit 0
          elif [ "$TARGET_SPECS" = "ALL" ] || [ -z "$TARGET_SPECS" ]; then
            RUN_CMD="bash tests/e2e/run-e2e.sh $SHARD_ARG"
          else
            RUN_CMD="bash tests/e2e/run-e2e.sh $TARGET_SPECS $SHARD_ARG"
          fi

          echo "→ Running: $RUN_CMD"
          if ! $RUN_CMD; then
            echo "⚠️ E2E test shard failed on first attempt. Retrying whole shard once with clean environment..."
            sleep 5
            $RUN_CMD
          fi

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

  merge-reports:
    name: Merge E2E Reports
    if: always()
    needs: [test-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.9.0'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Download all blob reports
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        # A shard's report can arrive truncated when the artifact download fails
        # (the download step above is continue-on-error). Skip unreadable archives
        # with a warning instead of letting one of them fail the whole merge.
        run: |
          shopt -s nullglob
          mkdir -p ./all-blob-reports
          valid=0
          for report in ./all-blob-reports/*.zip; do
            if unzip -tq "$report" > /dev/null 2>&1; then
              valid=$((valid + 1))
            else
              echo "::warning::Skipping unreadable blob report $(basename "$report"): the artifact download was incomplete or the archive is truncated."
              rm -f "$report"
            fi
          done
          if [ "$valid" -gt 0 ]; then
            echo "→ Merging $valid Playwright blob report(s)..."
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "✓ No readable blob reports to merge (E2E tests were skipped or none executed)."
            mkdir -p playwright-report
            echo "<html><body><p>No E2E tests were executed for this run.</p></body></html>" > playwright-report/index.html
          fi

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
