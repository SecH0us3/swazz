name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'GEMINI.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'GEMINI.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v4.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            frontend:
              - 'packages/web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            backend:
              - 'packages/container/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'packages/web/**'
              - 'packages/edge/**'
              - 'packages/container/**'
              - 'demo/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.ts'
              - '.github/workflows/ci.yml'

  test-frontend:
    name: Test Frontend
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.9.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --workspace=packages/web

  test-backend:
    name: Test Backend
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        # v6.4.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache-dependency-path: packages/container/go.sum

      - name: Run tests
        run: cd packages/container && go test -v ./...

  test-e2e:
    name: Test E2E (Playwright) - Shard ${{ matrix.shardIndex }} of ${{ matrix.shardTotal }}
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      # v6.0.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        # v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.9.0'
          cache: 'npm'

      - name: Set up Go
        # v6.4.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
          cache-dependency-path: packages/container/go.sum

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          TARGET_SPECS=$(bash scripts/get-affected-e2e.sh)
          SHARD_ARG="--shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
          if [ "$TARGET_SPECS" = "NONE" ]; then
            echo "✓ No frontend or edge routes affected by this change. Skipping browser E2E tests."
          elif [ "$TARGET_SPECS" = "ALL" ] || [ -z "$TARGET_SPECS" ]; then
            echo "→ Running full Playwright E2E test suite"
            bash tests/e2e/run-e2e.sh $SHARD_ARG
          else
            echo "→ Running targeted Playwright specs: $TARGET_SPECS"
            bash tests/e2e/run-e2e.sh $TARGET_SPECS $SHARD_ARG
          fi

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

  merge-reports:
    name: Merge E2E Reports
    if: always()
    needs: [test-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '25.9.0'

      - name: Install dependencies
        run: npm install

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        run: |
          if [ -d "./all-blob-reports" ] && [ -n "$(ls -A ./all-blob-reports 2>/dev/null)" ]; then
            echo "→ Merging Playwright blob reports..."
            npx playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "✓ No blob reports found to merge (E2E tests were skipped or none executed)."
            mkdir -p playwright-report
            echo "<html><body><p>No E2E tests were executed for this run.</p></body></html>" > playwright-report/index.html
          fi

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
