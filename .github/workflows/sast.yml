name: SAST

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'GEMINI.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'GEMINI.md'
      - '.gitignore'
      - 'docs/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gosec:
    name: GoSec Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      # v4.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        # v6.4.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.4'
          cache-dependency-path: packages/container/go.sum
      - name: Install GoSec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.1
      - name: Run GoSec
        working-directory: packages/container
        continue-on-error: true  # exit 1 when findings exist; SARIF upload must still run
        run: |
          gosec -conf ../../.gosec.conf -exclude=G404 -fmt sarif -out gosec.sarif ./...
      - name: Upload SARIF to GitHub Code Scanning
        if: always()  # upload findings even when gosec exits with code 1
        # v4.35.5
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          sarif_file: packages/container/gosec.sarif
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [go]
    steps:
      - name: Checkout repository
        # v4.3.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        # v6.4.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.4'
          cache-dependency-path: packages/container/go.sum
      - name: Initialize CodeQL
        # v4.35.5
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          languages: ${{ matrix.language }}
      - name: Build Go code
        working-directory: packages/container
        run: go build ./...
      - name: Perform CodeQL Analysis
        # v4.37.0
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: "${{ matrix.language }}-analysis"
